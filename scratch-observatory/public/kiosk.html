<!doctype html>
<html lang="sv" class="kiosk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d100e">
<title>Huset – kiosk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="theme.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="house.css">
<link rel="stylesheet" href="kiosk.css">
</head>
<body data-page="oversikt" class="kiosk">
<div class="content">
<!-- Rubrik och knappar finns kvar men döljs: översiktens skript behöver dem -->
<header class="top" hidden>
  <div>
    <div class="eyebrow"><span class="slash">//</span> OBSERVATORIET / HEMMA</div>
    <h1 id="title">Huset / översikt.</h1>
    <p id="subtitle"></p>
  </div>
  <div class="top-right">
    <span id="badge" class="badge stale"><i></i><span>Väntar på data</span></span>
    <span id="clock" class="mono"></span>
    <div class="btns">
      <div class="seg" role="group" aria-label="Ljus">
        <button data-mode="auto" aria-pressed="true">Auto</button><button data-mode="day">Dag</button><button data-mode="night">Natt</button>
      </div>
      <button id="edit-btn">Redigera layout</button>
    </div>
  </div>
</header>

<div id="edit-bar" class="edit-bar" hidden>
  <span>Dra rutorna och de runda punkterna. Dra hörnen på klickytorna, dra en liten mittpunkt för att lägga till ett hörn och dubbelklicka på ett hörn för att ta bort det.</span>
  <span class="edit-actions">
    <button id="edit-reset">Återställ standard</button>
    <button id="edit-cancel">Avbryt</button>
    <button id="edit-save" class="primary">Spara</button>
  </span>
</div>

<main>
  <section class="frame">
    <div id="stage" class="stage">
      <img id="photo" src="foto/hus.jpg" alt="Foto av huset" draggable="false">
      <div class="tint"></div>
      <div id="glows" class="glows" aria-hidden="true"></div>
      <svg id="hot" class="hot" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <svg id="wires" class="wires"></svg>
      <div id="handles" class="handles"></div>
    </div>
    <div id="boxes" class="boxes"></div>
  </section>
</main>
<aside id="kcal" class="kcal" aria-label="Kalender"></aside>
<div id="kmedia" class="kmedia" aria-live="polite"></div>
<button id="kalarm" class="kalarm" data-open="alarm" hidden></button>
<nav id="kmenu" class="kmenu" aria-label="Meny">
  <button data-open="lights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Lampor</span><i id="kmenu-lights"></i></button>
  <button data-open="vacuum"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M8 5.5h8"/></svg><span>Dammsugare</span><i id="kmenu-vac"></i></button>
  <button data-open="info"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10M12 11v5M12 8v.5"/></svg><span>Hus-info</span><i id="kmenu-info" class="warn"></i></button>
  <button data-open="alarm" id="kmenu-alarmbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.6-3.4 8.1-8 9-4.6-.9-8-4.4-8-9V6z"/></svg><span>Larm</span><i id="kmenu-alarm"></i></button>
  <button data-open="chores"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg><span>Poäng</span></button>
</nav>

</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><div class="eyebrow" id="drawer-eyebrow"></div><h3 id="drawer-title"></h3></div>
    <button id="drawer-close" aria-label="Stäng">✕</button>
  </div>
  <div id="drawer-body"><div id="drawer-stats"></div><div id="drawer-charts"></div></div>
</aside>
<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="house.js"></script>
<script src="kiosk.js"></script>
</body>
</html>
