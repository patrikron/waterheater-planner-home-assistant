name: Release

# Publish a release on GitHub (tag vX.Y.Z, matching "version" in manifest.json).
# This attaches a zip of the integration, ready to be unpacked into config/custom_components/.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/waterheater_planner/manifest.json"))["version"])')"
          echo "tag=$tag manifest=$version"
          test "$tag" = "$version" || { echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest -q

      - name: Build the zip
        run: |
          cd custom_components
          zip -r ../waterheater_planner.zip waterheater_planner -x "*/__pycache__/*"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" waterheater_planner.zip --clobber
