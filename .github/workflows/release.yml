name: Release

# Push a tag vX.Y.Z (matching "version" in manifest.json) and this creates the GitHub release
# and attaches a zip of the integration, ready to be unpacked into config/custom_components/.
#   git tag v0.19.0 && git push origin v0.19.0
# Publishing a release by hand in the GitHub UI works too.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/waterheater_planner/manifest.json"))["version"])')"
          echo "tag=$tag manifest=$version"
          test "$tag" = "$version" || { echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest -q

      - name: Build the zip
        run: |
          cd custom_components
          zip -r ../waterheater_planner.zip waterheater_planner -x "*/__pycache__/*"

      - name: Create the release if the tag has none, then attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" waterheater_planner.zip --clobber
